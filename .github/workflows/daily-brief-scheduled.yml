name: Daily Brief (Scheduled)
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and Send Daily Brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyaqJYtkmtY0FVKlGPEiYYDBXrcuEYXL5EjnQSPfUD10jTulH96IDw9Yyu7ZTuoDYojLg/exec"
          SCRIPT_B64: ""
        run: |
          pip install -q google-genai
          echo "$SCRIPT_B64" | base64 -d | python3
