name: Daily Brief (Scheduled)
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Generate & Send Daily Brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyaqJYtkmtY0FVKlGPEiYYDBXrcuEYXL5EjnQSPfUD10jTulH96IDw9Yyu7ZTuoDYojLg/exec"
        run: |
          pip install -q google-genai
          python3 << 'PYEOF'
          from google import genai
          from google.genai.types import Tool, GenerateContentConfig, GoogleSearch
          import json, os, datetime, urllib.request

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          # Taipei time & day
          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz)
          weekdays = ['一','二','三','四','五','六','日']
          date_str = f"{now.strftime('%Y/%m/%d')}（{weekdays[now.weekday()]}）"
          day_num = now.isoweekday()

          topics = {
              1: '台灣大盤 - 台指期、加權指數、外資動向',
              2: 'AI 主題 - NVDA、廣達(2382)、緯創(3231)',
              3: '電動車 - TSLA、台達電(2308)、和泰(2207)',
              4: '美股大盤 - S&P500、那斯達克、VIX、Fed',
              5: '量子/半導體 - 台積電(2330)、NVDA、IBM、IONQ',
              6: '總經觀察 - 利率、通膨、匯率、原物料',
              7: '下週前瞻 - 重要事件、財報、經濟數據',
          }
          topic = topics[day_num]
          weekday_zh = weekdays[now.weekday()]

          search_config = GenerateContentConfig(
              tools=[Tool(google_search=GoogleSearch())]
          )

          # Try models in order
          MODELS = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-1.5-pro']

          def call_gemini(prompt):
              for model in MODELS:
                  try:
                      r = client.models.generate_content(
                          model=model, contents=prompt, config=search_config
                      )
                      print(f"Used model: {model}")
                      return r.text.strip()
                  except Exception as e:
                      print(f"Model {model} failed: {e}")
              raise RuntimeError("All models failed")

          # Step 1: News
          news_prompt = f"""你是財經早報助理。今天是 {date_str}。
請用 Google 搜尋找今天最新資訊，用繁體中文整理（純文字，不用 * _ # ` 等符號）：

每日早報 - {date_str}

國際
- [新聞標題] (Source: [媒體名稱])
- [新聞標題] (Source: [媒體名稱])
- [新聞標題] (Source: [媒體名稱])

財經
- [新聞標題] (Source: [媒體名稱])
- [新聞標題] (Source: [媒體名稱])
- [新聞標題] (Source: [媒體名稱])

台灣
- [新聞標題] (Source: [媒體名稱])
- [新聞標題] (Source: [媒體名稱])

小結
[2-3句：今日最核心訊號與為何重要]"""

          news_text = call_gemini(news_prompt)
          print("=== NEWS DONE ===")

          # Step 2: Stock analysis
          stock_prompt = f"""你是財經分析師。今天是 {date_str}。
請用 Google 搜尋找「{topic}」最新資訊，用繁體中文寫分析（純文字，不用 * _ # ` 等符號）：

今日聚焦：{topic}（週{weekday_zh}輪播）

[150-200字段落分析，包含最新數據與趨勢]

重點提示
- [重點] (Source: [媒體])
- [重點] (Source: [媒體])
- [重點] (Source: [媒體])

AI 觀點
[以「我認為」開頭，100-150字，具體分析機會或風險，點出投資人應觀察的指標]

Sources: [媒體名稱]"""

          stock_text = call_gemini(stock_prompt)
          print("=== STOCK DONE ===")

          # Step 3: Broadcast via Apps Script
          secret = os.environ['BROADCAST_SECRET']
          url = os.environ['APPS_SCRIPT_URL']
          payload = json.dumps({"secret": secret, "news": news_text, "stock": stock_text}).encode()
          req = urllib.request.Request(url, data=payload,
                  headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("Apps Script:", resp.read().decode())

          print(f"SUCCESS: {date_str} - {topic}")
          PYEOF