name: Daily Brief (Scheduled)
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Generate & Send Daily Brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyaqJYtkmtY0FVKlGPEiYYDBXrcuEYXL5EjnQSPfUD10jTulH96IDw9Yyu7ZTuoDYojLg/exec"
        run: |
          pip install -q google-genai
          python3 << 'PYEOF'
from google import genai
from google.genai.types import Tool, GenerateContentConfig, GoogleSearch
import json, os, datetime, urllib.request

client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
tz = datetime.timezone(datetime.timedelta(hours=8))
now = datetime.datetime.now(tz)
weekdays = ["一","二","三","四","五","六","日"]
date_str = f"{now.strftime(\""%Y/%m/%d"")}({weekdays[now.weekday()]})"
day_num = now.isoweekday()
topics = {1:"taiwan_market",2:"ai_theme",3:"ev",4:"us_market",5:"semiconductor",6:"macro",7:"week_ahead"}
topic_zh = {1:"台灣大盤 - 台指期、加權指數、外資動向",2:"AI 主題 - NVDA、廣達(2382)、緯創(3231)",3:"電動車 - TSLA、台達電(2308)、和泰(2207)",4:"美股大盤 - S&P500、那斯達克、VIX、Fed",5:"量子/半導體 - 台積電(2330)、NVDA、IBM、IONQ",6:"總經觀察 - 利率、通膨、匯率、原物料",7:"下週前瞻 - 重要事件、財報、經濟數據"}
topic = topic_zh[day_num]
wday = weekdays[now.weekday()]
MODELS = ["gemini-2.5-flash","gemini-1.5-flash","gemini-1.5-pro"]
cfg = GenerateContentConfig(tools=[Tool(google_search=GoogleSearch())])

def ask(prompt):
    for m in MODELS:
        try:
            r = client.models.generate_content(model=m,contents=prompt,config=cfg)
            print(f"model={m}")
            return r.text.strip()
        except Exception as e:
            print(f"{m} failed: {e}")
    raise RuntimeError("all models failed")

news = ask(f"""你是財經早報助理。今天是{date_str}。請用Google搜尋今天最新資訊，用繁體中文整理（純文字不用*_#`符號）：

每日早報 - {date_str}

國際
- [新聞標題] (Source: [媒體])
- [新聞標題] (Source: [媒體])
- [新聞標題] (Source: [媒體])

財經
- [新聞標題] (Source: [媒體])
- [新聞標題] (Source: [媒體])
- [新聞標題] (Source: [媒體])

台灣
- [新聞標題] (Source: [媒體])
- [新聞標題] (Source: [媒體])

小結
[2-3句：今日最核心訊號]""")
print("NEWS OK")

stock = ask(f"""你是財經分析師。今天是{date_str}。請用Google搜尋「{topic}」最新資訊，用繁體中文寫分析（純文字不用*_#`符號）：

今日聚焦：{topic}（週{wday}輪播）

[150-200字段落分析]

重點提示
- [重點] (Source: [媒體])
- [重點] (Source: [媒體])
- [重點] (Source: [媒體])

AI 觀點
[以我認為開頭，100-150字，具體分析機會或風險]

Sources: [媒體名稱]""")
print("STOCK OK")

secret = os.environ["BROADCAST_SECRET"]
url = os.environ["APPS_SCRIPT_URL"]
payload = json.dumps({"secret":secret,"news":news,"stock":stock}).encode()
req = urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"},method="POST")
with urllib.request.urlopen(req,timeout=30) as resp:
    print("broadcast:",resp.read().decode())
print(f"DONE: {date_str} {topic}")
PYEOF