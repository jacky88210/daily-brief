name: Send Telegram Daily Brief
on:
  push:
    paths:
      - 'daily-report/latest.json'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Broadcast via Apps Script
        env:
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyaqJYtkmtY0FVKlGPEiYYDBXrcuEYXL5EjnQSPfUD10jTulH96IDw9Yyu7ZTuoDYojLg/exec"
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os

          with open('daily-report/latest.json', encoding='utf-8') as f:
              data = json.load(f)

          news = data['news']
          stock = data['stock']
          secret = os.environ['BROADCAST_SECRET']
          url = os.environ['APPS_SCRIPT_URL']

          payload = json.dumps({"secret": secret, "news": news, "stock": stock})
          result = subprocess.run(
              ["curl", "-s", "-w", "\n%{http_code}", "-X", "POST", url,
               "-H", "Content-Type: application/json", "-d", payload],
              capture_output=True, text=True
          )
          print(result.stdout)
          if result.returncode != 0:
              print(result.stderr)
          PYEOF
