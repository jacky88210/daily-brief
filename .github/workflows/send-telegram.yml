name: Send Telegram Daily Brief
on:
  push:
    paths:
      - 'daily-report/latest.json'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Broadcast via Apps Script
        env:
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyaqJYtkmtY0FVKlGPEiYYDBXrcuEYXL5EjnQSPfUD10jTulH96IDw9Yyu7ZTuoDYojLg/exec"
        run: |
          NEWS=$(jq -r '.news' daily-report/latest.json)
          STOCK=$(jq -r '.stock' daily-report/latest.json)
          PAYLOAD=$(python3 -c "
          import json, sys
          news = sys.argv[1]
          stock = sys.argv[2]
          secret = sys.argv[3]
          print(json.dumps({'secret': secret, 'news': news, 'stock': stock}))
          " "$NEWS" "$STOCK" "$BROADCAST_SECRET")
          curl -s -X POST "$APPS_SCRIPT_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
